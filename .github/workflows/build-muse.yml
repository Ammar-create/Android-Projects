name: Build MUSE APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'projects/MusePlayer/**'
      - '.github/workflows/build-muse.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.14.3'

    # NOTE: android-actions/setup-android@v3 is broken on current runners
    # (it fails on its own "Setup Android SDK" step). Use the SDK that ships
    # with the ubuntu-latest image and install the extra bits ourselves.
    - name: Locate Android SDK
      run: |
        SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
        if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
        if [ ! -d "$SDK" ]; then
          echo "::error::No Android SDK found on runner"
          exit 1
        fi
        echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
        echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
        echo "Using SDK: $SDK"

    - name: Install Android SDK components
      run: |
        SDK="$ANDROID_HOME"
        SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SM" ]; then SM="$(command -v sdkmanager || true)"; fi
        if [ -z "$SM" ]; then
          echo "::error::sdkmanager not found"
          exit 1
        fi
        yes | "$SM" --licenses > /dev/null 2>&1 || true
        "$SM" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

    - name: Build MUSE release APK
      working-directory: projects/MusePlayer
      run: |
        set -o pipefail
        gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/muse-build.log

    # Job logs need admin rights to download over the API, so surface the
    # interesting part of the build log back into the repo instead.
    - name: Publish build log
      if: always()
      run: |
        set +e
        LOG=/tmp/muse-build.log
        if [ ! -f "$LOG" ]; then echo "no build log captured" > "$LOG"; fi
        {
          echo "### MUSE CI build log"
          echo "commit: $GITHUB_SHA"
          echo "run: $GITHUB_RUN_ID"
          echo
          echo "=== ERROR LINES ==="
          grep -nE "^e: |error:|What went wrong|Execution failed|FAILURE:|Unresolved reference|Compilation error|Could not|Cannot access" "$LOG" | head -150
          echo
          echo "=== TAIL 250 ==="
          tail -n 250 "$LOG"
        } > projects/MusePlayer/BUILD-LOG.txt
        git config user.name "muse-ci"
        git config user.email "muse-ci@users.noreply.github.com"
        git add -f projects/MusePlayer/BUILD-LOG.txt
        git commit -m "ci: capture MUSE build log [skip ci]" > /dev/null 2>&1
        git push > /dev/null 2>&1
        echo "build log published"

    - name: Show outputs
      if: success()
      run: find projects/MusePlayer/app/build/outputs -name '*.apk' -exec ls -la {} \;

    - name: Upload APK as artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: muse-release-unsigned
        path: projects/MusePlayer/app/build/outputs/apk/release/*.apk
        if-no-files-found: error

    # Public download path: release assets need no auth on a public repo.
    - name: Publish APK to Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: muse-build-${{ github.run_number }}
        name: MUSE v2 (build ${{ github.run_number }})
        body: |
          Unsigned release APK for MUSE ${{ github.sha }}.
          Sign locally with muse.keystore before installing.
        files: projects/MusePlayer/app/build/outputs/apk/release/*.apk
        prerelease: true
        make_latest: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
